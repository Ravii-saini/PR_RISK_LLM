[project]
name = "pr-risk-copilot"
version = "0.1.0"
description = "Automated PR structural-risk review grounded in codebase retrieval"
authors = [
    { name = "Ravii-saini", email = "ravisainijnv@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.34",
    "redis>=5.2",
    "httpx>=0.28",
    "pyjwt>=2.13.0",
    "cryptography>=50.0.0",
    "python-dotenv>=1.2",
    "tree-sitter>=0.26.0",
    "tree-sitter-python>=0.25.0",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.25",
    "respx>=0.22",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
