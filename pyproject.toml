[project]
name = "pr-risk-copilot"
version = "0.1.0"
description = "Automated PR structural-risk review grounded in codebase retrieval"
authors = [
    { name = "Ravii-saini", email = "ravisainijnv@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.34",
    "redis>=5.2",
    "httpx>=0.28",
    "pyjwt>=2.13.0",
    "cryptography>=50.0.0",
    "python-dotenv>=1.2",
    "tree-sitter>=0.26.0",
    "tree-sitter-python>=0.25.0",
    "tree-sitter-javascript>=0.25.0",
    "tree-sitter-typescript>=0.23.2",
    "tree-sitter-go>=0.25.0",
    "tree-sitter-java>=0.23.5",
    "psycopg[binary]>=3.2",
    "pgvector>=0.3",
    "sentence-transformers>=3.3",
    "apscheduler>=3.11",
    "transformers>=4.44,<5",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.25",
    "respx>=0.22",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-m 'not network'"
markers = [
    "network: hits real external APIs (GitHub) — excluded from the default run since repeated runs exhaust GitHub's 60/hr unauthenticated rate limit; run explicitly with `-m network`",
]
